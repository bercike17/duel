# Ezeket automatikusan beállítja a /duel setlobby és /duel setnpc parancs
lobby-location: null
npc-location: null
countdown-seconds: 5

# Engedélyezett parancsok duel közben (/duel mindig engedélyezett)
command-whitelist:
  - msg
  - r
  - helpop

# Placeholderek: %winner% = győztes neve, %loser% = vesztes neve
post-duel-commands:
  - "effect clear %winner%"
  - "effect clear %loser%"

